name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download CLIP models
        run: |
          mkdir -p app/src/main/assets/clip
          BASE="https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main"
          curl -L -o app/src/main/assets/clip/vision.onnx "$BASE/onnx/vision_model_quantized.onnx"
          curl -L -o app/src/main/assets/clip/text.onnx "$BASE/onnx/text_model_quantized.onnx"
          curl -L -o app/src/main/assets/clip/tokenizer.json "$BASE/tokenizer.json"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NpuClassifier-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
