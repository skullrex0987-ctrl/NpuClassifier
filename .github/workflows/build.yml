name: Build APK

on:
  push:
    branches: [main]
    tags: ['phase4-*']
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download CLIP models
        run: bash scripts/fetch_models.sh
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NpuClassifier-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Create pre-release (on tag)
        if: startsWith(github.ref, 'refs/tags/phase4-')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          gh release create "${GITHUB_REF_NAME}" "$APK" --prerelease --title "${GITHUB_REF_NAME}" --notes "Phase 4 pre-release. CI run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"